[package]
name = "kinetic-atlas-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0.151"

[dependencies.kinetic-atlas]
path = ".."

[[bin]]
name = "parse_config"
path = "fuzz_targets/parse_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proxy_extract"
path = "fuzz_targets/proxy_extract.rs"
test = false
doc = false
bench = false
