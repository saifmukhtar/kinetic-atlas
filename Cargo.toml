[package]
name = "kinetic-atlas"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
libp2p = { version = "0.53", features = ["tokio", "tcp", "dns", "noise", "yamux", "kad", "macros", "request-response", "cbor"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8.9"
hyper = "1.11.0"
dirs = "6.0.0"
bytes = "1.12.1"
serde_bytes = "0.11.19"
hickory-resolver = "0.24"
thiserror = "1.0"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.10.0"
