[package]
name = "kinetic-atlas"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libp2p = { version = "0.53", features = ["tokio", "tcp", "dns", "noise", "yamux", "kad", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
hickory-server = "0.24"
hickory-proto = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
async-trait = "0.1"

[dev-dependencies]
proptest = "1.11.0"
