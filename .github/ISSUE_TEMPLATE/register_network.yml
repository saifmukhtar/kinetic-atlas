name: Register Kinetic Network
description: Submit a new foreign network to the Atlas Global Registry
title: "Register Network: <TLD>"
labels: ["network-registration", "pending-automated-checks"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Welcome to the Atlas Registry! 🌐
        Fill out this form to add your network to the global Atlas Network. 
        **Note:** An automated bot will ping your seed domain and bootstrap nodes to ensure your network is live before creating a Pull Request.

  - type: markdown
    attributes:
      value: |
        ### 🧬 1. Core Network Identity
        *Fundamental, unchangeable identifiers for your network.*

  - type: input
    id: version
    attributes:
      label: 🔖 Protocol Version
      description: The version of the Atlas configuration schema this network uses.
      placeholder: "1.0"
    validations:
      required: true

  - type: input
    id: network_id
    attributes:
      label: 🆔 Network ID
      description: The unique identifier for your chain (e.g., `kinetic`).
      placeholder: kinetic
    validations:
      required: true

  - type: input
    id: tld_suffix
    attributes:
      label: 🏷️ TLD Suffix
      description: Your network's top-level domain suffix without the dot (must be alphanumeric).
      placeholder: kin
    validations:
      required: true

  - type: dropdown
    id: network_type
    attributes:
      label: 🌍 Network Type
      description: Select the environment classification for this network.
      options:
        - Public
        - Community
        - Dev
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### 🎨 2. Project Information & Media
        *Public-facing details that will appear on the Atlas directory.*

  - type: input
    id: description
    attributes:
      label: 📝 Short Description
      description: A brief summary of your network's purpose (max 100 characters).
      placeholder: A fast, privacy-focused fork of Kinetic.
    validations:
      required: true

  - type: input
    id: website
    attributes:
      label: 🌐 Project Website
      description: Where users can learn more about your network.
      placeholder: https://saifmkhtar.dev
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: 💻 Repository URL (Optional)
      description: The GitHub or GitLab URL of your project's source code.
      placeholder: https://github.com/saifmukhtar/kinetic

  - type: input
    id: logo_url
    attributes:
      label: 🖼️ Logo URL
      description: "Direct URL to your network's logo. **Must be PNG or SVG (Max 50KB).**"
      placeholder: https://example.com/logo.png
    validations:
      required: true

  - type: checkboxes
    id: integrations
    attributes:
      label: 🔌 Platform Integrations
      description: Select which platforms your network currently wishes to integrate with.
      options:
        - label: "Atlas Global Registry (Enable public discoverability)"
        - label: "Browser Extension Support (Allow interactions via web extension)"
        - label: "Desktop GUI Client (Provide a downloadable graphical interface)"
        - label: "Mobile App Integration (Support Android & iOS connections)"

  - type: markdown
    attributes:
      value: |
        ### ⚙️ 3. Node Configuration & Technical Connectivity
        *Technical details required for nodes and clients to connect.*

  - type: input
    id: seed_domain
    attributes:
      label: 📡 Seed Domain
      description: The primary DNS seed for your network (e.g., `seed.BASE_DOMAIN`).
      placeholder: seed.saifmkhtar.dev
    validations:
      required: true

  - type: textarea
    id: bootstrap_nodes
    attributes:
      label: 🚀 Hardcoded Bootstrap Nodes
      description: Provide **exactly 3** reliable, unique bootstrap nodes (one libp2p multiaddr per line).
      placeholder: |
        /ip4/44.219.188.204/tcp/6070/p2p/12D3KooWJkn8Dgb33N2p9sLBNX9Eg8W8whgdjLs2YJxWuTme7ZSs
    validations:
      required: true

  - type: input
    id: local_bind_ip
    attributes:
      label: 🖥️ Local Bind IP
      description: The local loopback IP (`127.0.0.X`) that local daemons should bind to.
      placeholder: 127.0.0.X
    validations:
      required: true

  - type: input
    id: api_port
    attributes:
      label: 🔌 API Port
      description: The daemon's HTTP REST API port.
      placeholder: "16002"
    validations:
      required: true

  - type: input
    id: binary_download
    attributes:
      label: 📦 Binary Download URL
      description: "**Required if you selected 'Desktop GUI Client'.** Link to your latest daemon binary."
      placeholder: https://github.com/saifmukhtar/kinetic/releases/latest
    validations:
      required: false

  - type: input
    id: ipfs_gateway
    attributes:
      label: 🪐 IPFS Gateway (Optional)
      description: The default IPFS gateway your network recommends.
      placeholder: https://ipfs.io
    validations:
      required: false

  - type: checkboxes
    id: preflight
    attributes:
      label: ✅ Pre-flight Checklist
      description: Please confirm the following before submitting.
      options:
        - label: "I confirm that my Seed Domain and Bootstrap Nodes are currently online."
        - label: "I confirm my logo is under 50KB and follows the PNG/SVG requirement."
    validations:
      required: true
